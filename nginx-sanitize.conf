server {
    listen 443 ssl;
    server_name _;

    # TLS certificates (from CLIProxyAPI)
    ssl_certificate /etc/ssl/carizon/server.crt;
    ssl_certificate_key /etc/ssl/carizon/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Management panel → CLIProxyAPI direct (no sanitization needed)
    location /management.html {
        proxy_pass http://127.0.0.1:18801;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v0/ {
        proxy_pass http://127.0.0.1:18801;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets for management panel
    location /assets/ {
        proxy_pass http://127.0.0.1:18801;
        proxy_set_header Host $host;
    }

    # API requests → Sanitize Proxy → CLIProxyAPI
    location / {
        proxy_pass http://127.0.0.1:18802;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE streaming support
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;

        # Long timeout for streaming responses
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
